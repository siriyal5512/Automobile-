text-align: center;<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071b12">

    <title>ANK AutoMind AI | Automotive Diagnostics</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #20d879;
            --dark: #071b12;
            --card: #10271c;
            --text: #f0fff5;
            --muted: #a5b9ac;
            --brown: #8b5a2b;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--dark);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background: #0b2116;
            border-bottom: 1px solid #244532;
            padding: 18px 5%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 52px;
            height: 52px;
            border: 2px solid var(--green);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: bold;
            color: var(--green);
            letter-spacing: 1px;
        }

        .brand h1 {
            font-size: 18px;
            line-height: 1.3;
        }

        .brand p {
            font-size: 11px;
            color: var(--green);
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
        }

        nav a:hover {
            color: var(--green);
        }

        .hero {
            padding: 75px 5% 65px;
            text-align: center;
            background:
                radial-gradient(
                    circle at top,
                    #17472c 0%,
                    #071b12 65%
                );
        }

        .badge {
            display: inline-block;
            color: var(--green);
            border: 1px solid #286644;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .hero h2 {
            font-size: clamp(30px, 6vw, 52px);
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .hero h2 span {
            color: var(--green);
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto 28px;
            color: var(--muted);
        }

        .button {
            display: inline-block;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: var(--green);
            color: #062012;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.85;
        }

        .button-secondary {
            background: transparent;
            color: var(--green);
            border: 1px solid var(--green);
            margin-left: 8px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 55px 5%;
        }

        .section-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-heading h2 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .section-heading p {
            color: var(--muted);
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid #244532;
            padding: 25px;
            border-radius: 14px;
        }

        .card h3 {
            margin-bottom: 12px;
            font-size: 18px;
        }

        .card p {
            color: var(--muted);
            font-size: 14px;
        }

        .icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .tool-section {
            background: #0a2015;
            border-top: 1px solid #193b28;
            border-bottom: 1px solid #193b28;
        }

        .form-card {
            max-width: 760px;
            margin: auto;
            background: var(--card);
            border: 1px solid #244532;
            padding: 25px;
            border-radius: 14px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 13px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #355341;
            background: #091b11;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--green);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .full-button {
            width: 100%;
            margin-top: 20px;
        }

        .result {
            display: none;
            margin-top: 22px;
            padding: 20px;
            background: #091b11;
            border: 1px solid var(--green);
            border-radius: 10px;
        }

        .result h3 {
            color: var(--green);
            margin-bottom: 12px;
        }

        .result p,
        .result li {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .result ul {
            padding-left: 20px;
        }

        .notice {
            margin-top: 20px;
            padding: 15px;
            border-left: 4px solid #e7b04b;
            background: #292416;
            color: #f7e7bd;
            font-size: 13px;
            border-radius: 5px;
        }

        .code-result {
            max-width: 760px;
            margin: 25px auto 0;
        }

        .code-result .card {
            margin-bottom: 12px;
        }

        .code-result h3 {
            color: var(--green);
        }

        .tips-list {
            padding-left: 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .tips-list li {
            margin-bottom: 12px;
        }

        .about-box {
            max-width: 800px;
            margin: auto;
            text-align: center;
 color: var(--muted);
}

.about-box strong {
    color: var(--green);
}

footer {
    padding: 30px 5%;
    text-align: center;
    background: #05130b;
    border-top: 1px solid #244532;
}

footer h3 {
    color: var(--green);
    margin-bottom: 8px;
}

footer p {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 5px;
}

.footer-stars {
    color: var(--brown);
    letter-spacing: 8px;
    margin-bottom: 10px;
}

@media (max-width: 650px) {
    .navbar {
        align-items: flex-start;
        flex-direction: column;
    }

    nav {
        gap: 12px;
    }

    .hero {
        padding-top: 55px;
    }

    .container {
        padding-top: 40px;
        padding-bottom: 40px;
    }
}
